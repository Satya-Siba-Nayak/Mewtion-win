name: Build & Release (Windows)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-pc-windows-msvc
            run_tests: true
          - arch: arm64
            target: aarch64-pc-windows-msvc
            run_tests: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Run unit tests (x86_64)
        if: matrix.run_tests
        run: cargo test --target ${{ matrix.target }}

      - name: Build release binaries (${{ matrix.arch }})
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Installer (.exe) & Advanced Portable Folder
        shell: pwsh
        run: |
          $RawTag = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "v0.1.0" }
          $CleanVer = $RawTag.TrimStart('v')
          $Arch = "${{ matrix.arch }}"
          $Target = "${{ matrix.target }}"
          $PkgName = "Mewtion-$RawTag-windows-$Arch"
          $DistDir = "dist/$PkgName"
          $AdvDir = "$DistDir/Advanced"

          New-Item -ItemType Directory -Force -Path "$AdvDir/assets" | Out-Null

          # Populate Advanced/ with the standalone portable executables & config
          Copy-Item "target/$Target/release/Mewtion.exe" "$AdvDir/"
          Copy-Item "target/$Target/release/control_panel.exe" "$AdvDir/"
          Copy-Item "start.bat" "$AdvDir/"
          Copy-Item "mewtion_config.txt" "$AdvDir/"
          Copy-Item "LICENSE" "$AdvDir/"
          Copy-Item "README.md" "$AdvDir/"
          Copy-Item "assets/dev.mewtion.Overlay.svg" "$AdvDir/assets/"
          Copy-Item "assets/mewtion.ico" "$AdvDir/assets/"

          # Build Windows Setup Installer (.exe) using Inno Setup (pre-installed on windows-latest)
          $IsccPaths = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          )
          $Iscc = $IsccPaths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($Iscc) {
            & $Iscc "/DMyAppVersion=$CleanVer" "/DMyAppArch=$Arch" "/DSourceDir=..\$AdvDir" "assets\installer.iss"
          } else {
            Write-Error "ISCC.exe not found!"
          }

          # Place the Setup Installer .exe and docs at the root of the package directory
          # alongside the Advanced/ folder
          Copy-Item "Mewtion-Setup-$RawTag-windows-$Arch.exe" "$DistDir/"
          Copy-Item "README.md" "$DistDir/"
          Copy-Item "LICENSE" "$DistDir/"

          # Create release zip containing Mewtion-Setup-*.exe at root + Advanced/ subfolder
          Compress-Archive -Path "$DistDir/*" -DestinationPath "$PkgName.zip" -Force

      - name: Upload Windows Package (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: Mewtion-windows-${{ matrix.arch }}
          path: dist/Mewtion-*-windows-${{ matrix.arch }}/*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            Mewtion-*-windows-${{ matrix.arch }}.zip
            Mewtion-Setup-*-windows-${{ matrix.arch }}.exe
          name: Mewtion for Windows ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
