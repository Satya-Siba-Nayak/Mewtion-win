name: Build & Release (Windows)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x86_64 Package
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package Portable Windows Archive (.zip)
        shell: pwsh
        run: |
          $Version = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "v0.1.0" }
          $PkgName = "Mewtion-$Version-windows-x86_64"
          $DistDir = "dist/$PkgName"

          New-Item -ItemType Directory -Force -Path "$DistDir/assets" | Out-Null

          Copy-Item "target/x86_64-pc-windows-msvc/release/Mewtion.exe" "$DistDir/"
          Copy-Item "target/x86_64-pc-windows-msvc/release/control_panel.exe" "$DistDir/"
          Copy-Item "start.bat" "$DistDir/"
          Copy-Item "mewtion_config.txt" "$DistDir/"
          Copy-Item "LICENSE" "$DistDir/"
          Copy-Item "README.md" "$DistDir/"
          if (Test-Path "assets/*") {
            Copy-Item "assets/*" "$DistDir/assets/" -Recurse -Force
          }

          Compress-Archive -Path "$DistDir" -DestinationPath "$PkgName.zip" -Force

      - name: Upload Windows Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mewtion-windows-x86_64
          path: Mewtion-*-windows-x86_64.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            Mewtion-*-windows-x86_64.zip
          name: Mewtion for Windows ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
