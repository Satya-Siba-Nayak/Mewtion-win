[package]
name = "Mewtion"
version = "0.1.0"
edition = "2021"
license = "MIT"
default-run = "Mewtion"

[dependencies]
iced = "0.14"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Devices_Sensors",
    "Foundation",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 2
